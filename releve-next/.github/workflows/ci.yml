name: releve-next CI

on:
  push:
    paths:
      - "releve-next/**"
  pull_request:
    paths:
      - "releve-next/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: releve-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
